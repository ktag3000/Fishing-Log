<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Creel — your fishing log</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Signed-out view -->
  <div id="gate" class="gate">
    <div class="gate-contours" aria-hidden="true">
      <svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <g fill="none" stroke="#1E4560" stroke-width="1.5">
          <path d="M950 120 C1120 160 1150 320 1080 460 C1010 600 800 640 680 560 C560 480 560 320 660 220 C740 140 850 100 950 120 Z"/>
          <path d="M940 170 C1060 200 1085 320 1030 420 C975 520 820 545 730 480 C645 420 645 310 715 240 C775 185 855 155 940 170 Z"/>
          <path d="M930 220 C1010 240 1025 320 990 385 C950 450 850 465 790 420 C735 380 735 305 785 260 C825 225 880 210 930 220 Z"/>
          <path d="M915 265 C965 278 972 320 950 355 C925 392 865 400 828 372 C795 348 795 305 826 280 C852 262 888 258 915 265 Z"/>
        </g>
        <g fill="#C9622D">
          <path d="M780 300 q22 -16 44 0 q-10 8 -22 8 q-12 0 -22 -8z"/>
          <path d="M824 300 l12 -9 v18 z"/>
        </g>
        <g fill="#EFE7D6" opacity="0.85">
          <path d="M870 400 q18 -13 36 0 q-8 6 -18 6 q-10 0 -18 -6z"/>
          <path d="M906 400 l10 -7 v14 z"/>
        </g>
        <g fill="#83A9C4" opacity="0.75">
          <path d="M700 480 q16 -12 32 0 q-7 6 -16 6 q-9 0 -16 -6z"/>
          <path d="M732 480 l9 -6 v12 z"/>
        </g>
      </svg>
    </div>
    <div class="gate-card">
      <p class="wordmark">Creel</p>
      <p class="tagline">A logbook for where you fish, what you catch, and what the water was doing when you caught it.</p>
      <button id="signInBtn" class="btn btn-primary">Sign in with Google</button>
      <p class="gate-note">Your spots and catches are private to your account.</p>
    </div>
  </div>

  <!-- Signed-in app -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <p class="wordmark small">Creel</p>
      <nav class="main-nav">
        <button class="nav-tab active" id="navMapBtn" type="button">Map</button>
        <button class="nav-tab" id="navReportsBtn" type="button">Reports</button>
        <button class="nav-tab" id="navLogBtn" type="button">Log</button>
      </nav>
      <div class="topbar-right">
        <button id="themeToggleBtn" class="btn btn-ghost btn-icon" title="Toggle dark mode" aria-label="Toggle dark mode">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
        <button id="helpBtn" class="btn btn-ghost btn-icon" title="Replay tutorial" aria-label="Replay tutorial">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        </button>
        <span id="userName" class="user-name"></span>
        <button id="signOutBtn" class="btn btn-ghost">Sign out</button>
      </div>
    </header>

    <!-- Onboarding / welcome tutorial -->
    <div id="onboardingModal" class="modal-overlay hidden">
      <div class="modal-box">
        <button id="onboardingSkip" class="modal-skip" type="button">Skip</button>
        <div id="onboardingSlide" class="modal-slide"></div>
        <div class="modal-footer">
          <div class="modal-dots" id="onboardingDots"></div>
          <div class="modal-nav">
            <button id="onboardingBack" class="btn btn-ghost" type="button">Back</button>
            <button id="onboardingNext" class="btn btn-primary" type="button">Next</button>
          </div>
        </div>
      </div>
    </div>

    <div class="layout" id="mapView">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <h2>Your spots</h2>
          <p class="hint">Click the map to drop a pin at a new spot.</p>
          <ul class="tier-legend" id="tierLegend"></ul>
        </div>
        <ul id="locationList" class="location-list"></ul>
      </aside>

      <main class="map-wrap">
        <div id="map"></div>
      </main>

      <!-- Location / catches drawer -->
      <section id="drawer" class="drawer hidden">
        <div id="drawerResizeHandle" class="drawer-resize-handle" aria-hidden="true"></div>
        <button id="drawerClose" class="drawer-close" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <div id="drawerContent"></div>
      </section>
    </div>

    <section class="reports-view hidden" id="reportsView">
      <div class="reports-inner" id="reportsContent">Loading your stats…</div>
    </section>

    <section class="reports-view hidden" id="logView">
      <div class="reports-inner log-inner" id="logContent">Loading your catches…</div>
    </section>
  </div>

  <!-- Trip form template -->
  <template id="tripFormTemplate">
    <form id="tripForm" class="catch-form">
      <h3>Log a trip</h3>

      <div class="field-row">
        <label>Start time
          <input type="datetime-local" name="tripStart" required>
        </label>
        <label>End time
          <input type="datetime-local" name="tripEnd">
        </label>
      </div>
      <div class="field-row">
        <label class="readonly-field">Moon phase
          <span id="tripMoonPhaseOut">—</span>
        </label>
        <label class="readonly-field">Duration
          <span id="tripDurationOut">—</span>
        </label>
      </div>

      <label class="checkbox-field full">
        <input type="checkbox" name="hadMiss">
        Had a miss (bite/strike, no catch)
      </label>

      <p class="section-label">Weather</p>
      <div class="field-row">
        <label>Air temp (°F)
          <input type="number" step="0.1" name="airTemp">
        </label>
        <label>Wind
          <input type="text" name="wind" placeholder="8mph SW">
        </label>
      </div>
      <label class="full">Sky
        <select name="sky">
          <option value="">—</option>
          <option>Clear</option>
          <option>Partly cloudy</option>
          <option>Overcast</option>
          <option>Rain</option>
        </select>
      </label>

      <p class="section-label">Water conditions</p>
      <div class="field-row">
        <label>Water temp (°F)
          <input type="number" step="0.1" name="waterTemp">
        </label>
        <label>Clarity
          <select name="clarity">
            <option value="">—</option>
            <option>Clear</option>
            <option>Stained</option>
            <option>Muddy</option>
          </select>
        </label>
      </div>
      <label class="full">Current / structure notes
        <input type="text" name="waterNotes" placeholder="Slow current, fishing near submerged timber">
      </label>

      <label class="full">Trip notes
        <textarea name="notes" rows="2" placeholder="How the day went overall..."></textarea>
      </label>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save trip</button>
        <button type="button" id="cancelTripForm" class="btn btn-ghost">Cancel</button>
      </div>
    </form>
  </template>

  <!-- Catch form template (belongs to a trip) -->
  <template id="catchFormTemplate">
    <form id="catchForm" class="catch-form">
      <h3>Log a catch</h3>

      <div class="field-row">
        <label>Species
          <input type="text" name="species" placeholder="Largemouth bass" required>
        </label>
        <label>Lure / bait
          <input type="text" name="lure" placeholder="Chatterbait">
        </label>
        <label>Lure color
          <input type="text" name="lureColor" placeholder="Chartreuse">
        </label>
      </div>

      <div class="field-row">
        <label>Length (in)
          <input type="number" step="0.1" name="length" placeholder="14.5">
        </label>
        <label>Weight (lb)
          <input type="number" step="0.01" name="weight" placeholder="2.3">
        </label>
        <label>Distance from shore (ft)
          <input type="number" step="1" name="distanceFromShore" placeholder="20">
        </label>
      </div>

      <label class="full">Notes
        <textarea name="notes" rows="2" placeholder="What worked, what didn't..."></textarea>
      </label>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save catch</button>
        <button type="button" id="cancelCatchForm" class="btn btn-ghost">Cancel</button>
      </div>
    </form>
  </template>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <!-- Google Maps loads app.js's initMap as its callback -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBWkcu65RynLwa8HXWYMu4aQcq1CaKI7qA&callback=initMap&loading=async" async defer></script>
</body>
</html>
