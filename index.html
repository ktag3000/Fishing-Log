<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Creel — your fishing log</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Signed-out view -->
  <div id="gate" class="gate">
    <div class="gate-contours" aria-hidden="true">
      <svg viewBox="0 0 600 400" preserveAspectRatio="none">
        <path d="M-20,300 C100,260 180,340 300,300 C420,260 500,320 620,280" />
        <path d="M-20,340 C120,300 200,370 320,330 C440,290 520,350 620,320" />
        <path d="M-20,220 C90,180 190,250 300,210 C410,170 500,230 620,190" />
      </svg>
    </div>
    <div class="gate-card">
      <p class="wordmark">Creel</p>
      <p class="tagline">A logbook for where you fish, what you catch, and what the water was doing when you caught it.</p>
      <button id="signInBtn" class="btn btn-primary">Sign in with Google</button>
      <p class="gate-note">Your spots and catches are private to your account.</p>
    </div>
  </div>

  <!-- Signed-in app -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <p class="wordmark small">Creel</p>
      <nav class="main-nav">
        <button class="nav-tab active" id="navMapBtn" type="button">Map</button>
        <button class="nav-tab" id="navReportsBtn" type="button">Reports</button>
      </nav>
      <div class="topbar-right">
        <span id="userName" class="user-name"></span>
        <button id="signOutBtn" class="btn btn-ghost">Sign out</button>
      </div>
    </header>

    <div class="layout" id="mapView">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <h2>Your spots</h2>
          <p class="hint">Click the map to drop a pin at a new spot.</p>
          <ul class="tier-legend" id="tierLegend"></ul>
        </div>
        <ul id="locationList" class="location-list"></ul>
      </aside>

      <main class="map-wrap">
        <div id="map"></div>
      </main>

      <!-- Location / catches drawer -->
      <section id="drawer" class="drawer hidden">
        <div id="drawerResizeHandle" class="drawer-resize-handle" aria-hidden="true"></div>
        <button id="drawerClose" class="drawer-close" aria-label="Close">&times;</button>
        <div id="drawerContent"></div>
      </section>
    </div>

    <section class="reports-view hidden" id="reportsView">
      <div class="reports-inner" id="reportsContent">Loading your stats…</div>
    </section>
  </div>

  <!-- Trip form template -->
  <template id="tripFormTemplate">
    <form id="tripForm" class="catch-form">
      <h3>Log a trip</h3>

      <div class="field-row">
        <label>Date & time
          <input type="datetime-local" name="tripDate" required>
        </label>
        <label class="readonly-field">Moon phase
          <span id="tripMoonPhaseOut">—</span>
        </label>
      </div>

      <label class="checkbox-field full">
        <input type="checkbox" name="hadMiss">
        Had a miss (bite/strike, no catch)
      </label>

      <p class="section-label">Water conditions</p>
      <div class="field-row">
        <label>Water temp (°F)
          <input type="number" step="0.1" name="waterTemp">
        </label>
        <label>Clarity
          <select name="clarity">
            <option value="">—</option>
            <option>Clear</option>
            <option>Stained</option>
            <option>Muddy</option>
          </select>
        </label>
      </div>
      <label class="full">Current / structure notes
        <input type="text" name="waterNotes" placeholder="Slow current, fishing near submerged timber">
      </label>

      <p class="section-label">Weather</p>
      <div class="field-row">
        <label>Air temp (°F)
          <input type="number" step="0.1" name="airTemp">
        </label>
        <label>Wind
          <input type="text" name="wind" placeholder="8mph SW">
        </label>
      </div>
      <label class="full">Sky
        <select name="sky">
          <option value="">—</option>
          <option>Clear</option>
          <option>Partly cloudy</option>
          <option>Overcast</option>
          <option>Rain</option>
        </select>
      </label>

      <label class="full">Trip notes
        <textarea name="notes" rows="2" placeholder="How the day went overall..."></textarea>
      </label>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save trip</button>
        <button type="button" id="cancelTripForm" class="btn btn-ghost">Cancel</button>
      </div>
    </form>
  </template>

  <!-- Catch form template (belongs to a trip) -->
  <template id="catchFormTemplate">
    <form id="catchForm" class="catch-form">
      <h3>Log a catch</h3>

      <div class="field-row">
        <label>Species
          <input type="text" name="species" placeholder="Largemouth bass" required>
        </label>
        <label>Lure / bait
          <input type="text" name="lure" placeholder="Chatterbait">
        </label>
        <label>Lure color
          <input type="text" name="lureColor" placeholder="Chartreuse">
        </label>
      </div>

      <div class="field-row">
        <label>Length (in)
          <input type="number" step="0.1" name="length" placeholder="14.5">
        </label>
        <label>Weight (lb)
          <input type="number" step="0.01" name="weight" placeholder="2.3">
        </label>
      </div>

      <label class="full">Notes
        <textarea name="notes" rows="2" placeholder="What worked, what didn't..."></textarea>
      </label>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save catch</button>
        <button type="button" id="cancelCatchForm" class="btn btn-ghost">Cancel</button>
      </div>
    </form>
  </template>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <!-- Google Maps loads app.js's initMap as its callback -->
</body>
</html>
